<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <!-- Cada icono nuevo lleva otro nombre: así el navegador no sigue mostrando el anterior desde su caché. -->
    <link rel="icon" type="image/svg+xml" href="/icon-calendar.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icon-calendar-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-calendar-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-calendar.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <meta
      name="description"
      content="Tu agenda, tus clientes, tu negocio. Gestiona tus citas, clientes y horarios desde un solo lugar."
    />
    <title>Agenda360 · Agenda y reservas online para profesionales</title>
  </head>
  <body>
    <!--
      Pantalla de carga mientras llega la app (la misma que FullPageLoader): el logotipo y tres puntos.
      React la reemplaza al arrancar. Lleva sus propios estilos: aún no hay CSS de la app.
    -->
    <style>
      .boot-loader {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 20px;
        background: #ffffff;
        color: #4a6cb0;
        font-family: "Plus Jakarta Sans Variable", ui-sans-serif, system-ui, sans-serif;
        /* Si la app llega enseguida, no se alcanza a ver. */
        animation: boot-in 0.3s ease-out 0.15s both;
      }
      .boot-logo {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        font-size: 30px;
        letter-spacing: -0.02em;
      }
      .boot-logo svg {
        width: 40px;
        height: 40px;
      }
      .boot-logo b {
        font-weight: 800;
      }
      .boot-logo span span {
        font-weight: 500;
      }
      .boot-dots {
        display: flex;
        gap: 6px;
      }
      .boot-dots i {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #4a6cb0;
        animation: boot-dot 1.2s ease-in-out infinite both;
      }
      .boot-dots i:nth-child(2) {
        animation-delay: 0.16s;
      }
      .boot-dots i:nth-child(3) {
        animation-delay: 0.32s;
      }
      @keyframes boot-in {
        from {
          opacity: 0;
        }
      }
      @keyframes boot-dot {
        0%,
        80%,
        100% {
          opacity: 0.25;
          transform: translateY(0) scale(0.85);
        }
        40% {
          opacity: 1;
          transform: translateY(-5px) scale(1);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .boot-dots i {
          animation: none;
          opacity: 0.6;
        }
      }
    </style>
    <div id="root">
      <div class="boot-loader" role="status" aria-label="Cargando">
        <span class="boot-logo">
          <svg viewBox="0 0 32 32" aria-hidden="true">
            <rect width="32" height="32" rx="8" fill="#4A6CB0" />
            <rect x="6.5" y="8" width="19" height="17.5" rx="3" fill="#FFFFFF" />
            <path d="M6.5 11a3 3 0 0 1 3-3h13a3 3 0 0 1 3 3v2.2h-19Z" fill="#DDD4F8" />
            <rect x="10.4" y="5.4" width="2.6" height="5.2" rx="1.3" fill="#FFFFFF" stroke="#4A6CB0" stroke-width="0.8" />
            <rect x="19" y="5.4" width="2.6" height="5.2" rx="1.3" fill="#FFFFFF" stroke="#4A6CB0" stroke-width="0.8" />
            <g fill="#A9BDE8">
              <rect x="9" y="15.6" width="3.4" height="3.2" rx="0.9" />
              <rect x="14.3" y="15.6" width="3.4" height="3.2" rx="0.9" />
              <rect x="19.6" y="15.6" width="3.4" height="3.2" rx="0.9" />
              <rect x="9" y="20.4" width="3.4" height="3.2" rx="0.9" />
              <rect x="19.6" y="20.4" width="3.4" height="3.2" rx="0.9" />
            </g>
            <rect x="14.3" y="20.4" width="3.4" height="3.2" rx="0.9" fill="#4A6CB0" />
          </svg>
          <span><b>Agenda</b><span>360</span></span>
        </span>
        <span class="boot-dots" aria-hidden="true"><i></i><i></i><i></i></span>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
