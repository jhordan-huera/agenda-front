<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <!-- Cada icono nuevo lleva otro nombre: así el navegador no sigue mostrando el anterior desde su caché. -->
    <link rel="icon" type="image/svg+xml" href="/icon-calendar.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icon-calendar-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-calendar-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-calendar.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <!--
      Modo de pantalla (spec 019): pone la clase `dark` y el theme-color antes de pintar nada, así no
      hay destello blanco (ver el archivo). Sin async ni defer, y antes de los estilos: tiene que
      correr ya.
    -->
    <script src="/theme-boot.js"></script>
    <meta
      name="description"
      content="Tu agenda, tus clientes, tu negocio. Gestiona tus citas, clientes y horarios desde un solo lugar."
    />
    <title>Agenda360 · Agenda y reservas online para profesionales</title>
    <!-- Página de reservas: sus datos se piden ya, mientras carga la app (ver el archivo). -->
    <script src="/early-data.js" async></script>
    <!--
      La letra (Sora) ya en la pantalla de carga: se pide desde el principio y se declara aquí, antes
      de que llegue el CSS de la app (en desarrollo lo trae el JS). Vite le pone a la URL el mismo
      nombre con hash que en el CSS de la app: es un solo archivo.
    -->
    <link rel="preload" href="/node_modules/@fontsource-variable/sora/files/sora-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin />
    <style>
      @font-face {
        font-family: "Sora Variable";
        font-style: normal;
        font-display: swap;
        font-weight: 100 800;
        src: url("/node_modules/@fontsource-variable/sora/files/sora-latin-wght-normal.woff2") format("woff2-variations");
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
      /* Modo oscuro: el fondo (--background de src/index.css) desde el primer instante, antes que nada. */
      @media screen {
        html.dark {
          background: #201612;
          color-scheme: dark;
        }
      }
    </style>
  </head>
  <body>
    <!--
      Pantalla de carga mientras llega la app (la misma que FullPageLoader): el logotipo y tres puntos.
      React la reemplaza al arrancar. Lleva sus propios estilos: aún no hay CSS de la app. Sus colores
      son los tokens de src/index.css en cada modo (npm run check:contrast comprueba los dos).
    -->
    <style>
      .boot-loader {
        --boot-ink: #c2410c;
        --boot-paper: #ffffff;
        --boot-highlight: #fcd9c2;
        --boot-soft: #ecab97;
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 20px;
        background: var(--boot-paper);
        color: var(--boot-ink);
        font-family: "Sora Variable", ui-sans-serif, system-ui, sans-serif;
        /* Si la app llega enseguida, no se alcanza a ver. */
        animation: boot-in 0.3s ease-out 0.15s both;
      }
      .boot-logo {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        font-size: 30px;
        letter-spacing: -0.02em;
      }
      .boot-logo svg {
        width: 40px;
        height: 40px;
      }
      .boot-logo b {
        font-weight: 800;
      }
      .boot-logo span span {
        font-weight: 500;
      }
      .boot-dots {
        display: flex;
        gap: 6px;
      }
      .boot-dots i {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--boot-ink);
        animation: boot-dot 1.2s ease-in-out infinite both;
      }
      /* Modo oscuro (spec 019): el logotipo como lo pinta BrandMark con los tokens oscuros. */
      html.dark .boot-loader {
        --boot-ink: #e36a43;
        --boot-paper: #201612;
        --boot-highlight: #573b28;
        --boot-soft: #7f4b3b;
      }
      .boot-dots i:nth-child(2) {
        animation-delay: 0.16s;
      }
      .boot-dots i:nth-child(3) {
        animation-delay: 0.32s;
      }
      @keyframes boot-in {
        from {
          opacity: 0;
        }
      }
      @keyframes boot-dot {
        0%,
        80%,
        100% {
          opacity: 0.25;
          transform: translateY(0) scale(0.85);
        }
        40% {
          opacity: 1;
          transform: translateY(-5px) scale(1);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .boot-dots i {
          animation: none;
          opacity: 0.6;
        }
      }
    </style>
    <div id="root">
      <div class="boot-loader" role="status" aria-label="Cargando">
        <span class="boot-logo">
          <svg viewBox="0 0 32 32" aria-hidden="true">
            <rect width="32" height="32" rx="8" style="fill: var(--boot-ink)" />
            <rect x="6.5" y="8" width="19" height="17.5" rx="3" style="fill: var(--boot-paper)" />
            <path d="M6.5 11a3 3 0 0 1 3-3h13a3 3 0 0 1 3 3v2.2h-19Z" style="fill: var(--boot-highlight)" />
            <rect x="10.4" y="5.4" width="2.6" height="5.2" rx="1.3" style="fill: var(--boot-paper); stroke: var(--boot-ink)" stroke-width="0.8" />
            <rect x="19" y="5.4" width="2.6" height="5.2" rx="1.3" style="fill: var(--boot-paper); stroke: var(--boot-ink)" stroke-width="0.8" />
            <g style="fill: var(--boot-soft)">
              <rect x="9" y="15.6" width="3.4" height="3.2" rx="0.9" />
              <rect x="14.3" y="15.6" width="3.4" height="3.2" rx="0.9" />
              <rect x="19.6" y="15.6" width="3.4" height="3.2" rx="0.9" />
              <rect x="9" y="20.4" width="3.4" height="3.2" rx="0.9" />
              <rect x="19.6" y="20.4" width="3.4" height="3.2" rx="0.9" />
            </g>
            <rect x="14.3" y="20.4" width="3.4" height="3.2" rx="0.9" style="fill: var(--boot-ink)" />
          </svg>
          <span><b>Agenda</b><span>360</span></span>
        </span>
        <span class="boot-dots" aria-hidden="true"><i></i><i></i><i></i></span>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
