name: Pruebas

# Spec 045: en cada PR a dev o a main y en cada subida a dev, la compilación, el lint y todas las
# comprobaciones (check:*, leídas de package.json: una nueva entra sola). Sin secretos ni variables, así
# que corre igual en los PR de Dependabot. Sin SENTRY_AUTH_TOKEN la compilación no crea ni sube mapas. No
# toca Vercel. main exige que «Comprobar» pase (regla de GitHub: ver README).
on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev]

# El job sólo lee el código.
permissions:
  contents: read

# Una versión nueva del mismo PR (o de dev) cancela la anterior.
concurrency:
  group: pruebas-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  comprobar:
    name: Comprobar
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # El Node de producción.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependencias
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Compilar
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Comprobaciones (check:*)
        run: |
          for comprobacion in $(node -p "Object.keys(require('./package.json').scripts).filter((s) => s.startsWith('check:')).join(' ')"); do
            echo "::group::npm run $comprobacion"
            npm run "$comprobacion"
            echo "::endgroup::"
          done
