# Actualizaciones automáticas de las dependencias (Dependabot abre un pull request por cada una;
# nada se publica solo). Este repositorio no tiene workflows de GitHub Actions: si se añaden, sumar
# el ecosistema github-actions como en agenda-backend.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    target-branch: dev
    open-pull-requests-limit: 5
    groups:
      menores:
        update-types: ["minor", "patch"]
    # Saltos de versión grandes que se prueban aparte (PR cerrados el 2026-10-13): TypeScript 7 es una
    # reescritura (Vercel compila con TypeScript) y los tipos de Node siguen al Node 24 de producción.
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
